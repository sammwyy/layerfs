[workspace]
resolver = "2"
members = [
    "crates/layerfs-core",
    "crates/layerfs-storage",
    "crates/layerfs-transaction",
    "crates/layerfs-adapter",
    "crates/layerfs-init",
    "crates/layerctl",
    "integrations/grub",
    "integrations/dnf",
    "integrations/pacman",
    "integrations/apt",
    "integrations/systemd-boot",
    "xtask",
    "tests/integration",
]
# Distro/package-manager integrations opt in explicitly (`-p layerfs-dnf`,
# `cargo build --workspace`, ...) rather than building with plain `cargo
# build` — the core system stays distro-agnostic by default.
default-members = [
    "crates/layerfs-core",
    "crates/layerfs-storage",
    "crates/layerfs-transaction",
    "crates/layerfs-adapter",
    "crates/layerfs-init",
    "crates/layerctl",
    "xtask",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Sammwy"]
repository = "https://github.com/sammwyy/layerfs"

[workspace.dependencies]
layerfs-core = { version = "0.1.0", path = "crates/layerfs-core" }
layerfs-storage = { version = "0.1.0", path = "crates/layerfs-storage" }
layerfs-transaction = { version = "0.1.0", path = "crates/layerfs-transaction" }
layerfs-adapter = { version = "0.1.0", path = "crates/layerfs-adapter" }
rustix = { version = "1", features = ["mount", "fs", "process", "system", "thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
lexopt = "0.3"

[profile.release]
lto = true
strip = true
